name: Build WhisperX Sidecar

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Manual trigger

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: macos-arm64
            pyinstaller_args: ""
          - os: macos-15        # Intel Mac
            target: macos-x64
            pyinstaller_args: ""
          # TODO: Linux disabled — compressed binary still exceeds GitHub's 2GB
          # release asset limit. PyTorch on Linux is ~1.5GB alone. Options:
          # - Use PyTorch CPU-only wheel (smaller)
          # - Split into multiple files
          # - Use a different release host (e.g., S3, R2)
          # - Build with Docker-based approach instead of PyInstaller
          # Also note: requires glibc 2.31+ (Ubuntu 22.04+), won't work on
          # Alpine/musl, older CentOS/RHEL, or lightweight distros.
          # - os: ubuntu-22.04
          #   target: linux-x64
          #   pyinstaller_args: ""
          - os: windows-latest
            target: windows-x64
            pyinstaller_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install whisperx pyinstaller
          pip install transformers tokenizers huggingface-hub
          # torchcodec may not have wheels for all platforms — install if available
          pip install torchcodec || echo "torchcodec not available for this platform, skipping"

      - name: Build standalone binary
        run: |
          # Build base args
          ARGS="--onefile --name whisperx_server"
          ARGS="$ARGS --collect-all whisperx"
          ARGS="$ARGS --collect-all faster_whisper"
          ARGS="$ARGS --collect-all ctranslate2"
          ARGS="$ARGS --collect-all pyannote"
          ARGS="$ARGS --collect-all transformers"
          ARGS="$ARGS --collect-all tokenizers"
          ARGS="$ARGS --copy-metadata torch"
          ARGS="$ARGS --copy-metadata torchaudio"
          ARGS="$ARGS --copy-metadata transformers"
          ARGS="$ARGS --copy-metadata tokenizers"
          ARGS="$ARGS --copy-metadata huggingface-hub"
          ARGS="$ARGS --copy-metadata safetensors"
          ARGS="$ARGS --copy-metadata faster-whisper"
          ARGS="$ARGS --copy-metadata ctranslate2"
          ARGS="$ARGS --copy-metadata whisperx"
          ARGS="$ARGS --copy-metadata pyannote-audio"
          ARGS="$ARGS --copy-metadata pyannote-core"
          ARGS="$ARGS --copy-metadata pyannote-pipeline"

          # torchcodec: collect if installed (may not be available on all platforms)
          if python -c "import torchcodec" 2>/dev/null; then
            ARGS="$ARGS --collect-all torchcodec --copy-metadata torchcodec"
          fi

          pyinstaller $ARGS scripts/whisperx_server.py
        shell: bash

      - name: Compress binary
        run: |
          cd dist
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            7z a -mx9 whisperx_server-${{ matrix.target }}.zip whisperx_server.exe
          else
            tar czf whisperx_server-${{ matrix.target }}.tar.gz whisperx_server
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperx_server-${{ matrix.target }}
          path: dist/whisperx_server-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## WhisperX Sidecar Binaries

            Pre-built WhisperX alignment server for pocket-tts.

            Download for your platform, extract, and place next to your app executable.
            Includes Python + PyTorch + WhisperX — no external dependencies needed.

            | Platform | File |
            |----------|------|
            | macOS ARM64 (M1/M2/M3) | `whisperx_server-macos-arm64.tar.gz` |
            | macOS Intel | `whisperx_server-macos-x64.tar.gz` |
            | Windows x64 | `whisperx_server-windows-x64.zip` |

            Linux build is pending — see issue in workflow comments.
